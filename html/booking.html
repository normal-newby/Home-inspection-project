<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/inspectionPage.css">
</head>
<body>
    <div class="container">
        <div class = "navbar">
            <div class = "navbarBox">
                <p><a href="index.html">Home</a></p>
            </div>
            <div class = "navbarBox">
                <p><a href="scheduler.html">Scheduler</a></p>
            </div>
            <div class = "navbarBox">
                <p><a href="booking.html">Book inspection</a></p>
            </div>
            <div class = "navbarBox">
                <p><a href="profile.html">Profile</a></p>
            </div>
        </div>
        <h1>Book an Inspection</h1>
        <hr>
        <form action="/submit_booking" method="post">
            <fieldset class = "bookingFieldSet">
                <legend class = "legends">Inspection Address</legend>
                <label for="inspection_address">Inspection Address:*</label>
                <input type="text" id="inspection_address" name="inspection_address" placeholder="69 lord seaton" required>
                <label for="Suite">Suite</label>
                <input type="text" id="Suite" name="Suite" placeholder="420">
                <label for="City">City*</label>
                <input type="text" id="City" name="City" placeholder="Toronto" required>
                <label for="Zip">Zip/Postal</label>
                <input type="text" id="Zip" name="Zip" placeholder="M1M1M1">
                <label for="Province">Province/State</label>
                <select id="Province" name="Province">
                    <option value="" disabled selected>Select your option</option>
                    <option value="ON">Ontario</option>
                    <option value="QC">Quebec</option>
                    <option value="NS">Nova Scotia</option>
                    <option value="NB">New Brunswick</option>
                    <option value="MB">Manitoba</option>
                    <option value="BC">British Columbia</option>
                    <option value="PE">Prince Edward Island</option>
                    <option value="SK">Saskatchewan</option>   
                    <option value="AB">Alberta</option>
                    <option value="NL">Newfoundland and Labrador</option>
                    <option value="NT">Northwest Territories</option>
                    <option value="YT">Yukon</option>
                    <option value="NU">Nunavut</option>
                </select>
            </fieldset>
            <fieldset class="bookingFieldSet">
                <legend class="legends">Client Info</legend>
                <label for="first_name">First Name:*</label>
                <input type="text" id="first_name" name="first_name" placeholder="John" required>
                <label for="last_name">Last Name:*</label>
                <input type="text" id="last_name" name="last_name" placeholder="Doe" required>
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" placeholder="djliu@hotmail.com">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" placeholder="416-420-6969">
                <label for="inspection_adress">The inspection address is also the client's address</label>"
                <input type="checkbox" id="same_address" name="same_address">
            </fieldset>
            <fieldset class="bookingFieldSet">
                <legend class="legends">Reference*</legend>

                <input type="radio" id="none_reference" name="referred_by" value="None" checked>
                <label for="none_reference">None</label>

                <input type="radio" id="buyer_agent_reference" name="referred_by" value="Buyer Agent" required>
                <label for="buyer_agent_reference">Buyer Agent</label>

                <input type="radio" id="seller_agent_reference" name="referred_by" value="Seller Agent" required> 
                <label for="seller_agent_reference">Seller Agent</label>

                <input type="radio" id="friend_reference" name="referred_by" value="Friend" required>
                <label for="friend_reference">Friend</label>

                <input type="radio" id="family_reference" name="referred_by" value="Family" required>
                <label for="family_reference">Family</label>

                <input type="radio" id="lender_reference" name="referred_by" value="Lender" required>
                <label for="lender_reference">Lender</label>

                <input type="radio" id="other_reference" name="referred_by" value="Other" required>
                <label for="other_reference">Other</label>
            </fieldset>
            <fieldset class="bookingFieldSet">
                <legend class="legends">Booked by</legend>
                <input type="radio" id="none_booked" name="booked_by" value="None" checked>
                <label for="none_booked">None</label>

                <input type="radio" id="seller_agent_booked" name="booked_by" value="Seller Agent" required>
                <label for="seller_agent_booked">Seller Agent</label>

                <input type="radio" id="buyer_agent_booked" name="booked_by" value="Buyer Agent" required>
                <label for="buyer_agent_booked">Buyer Agent</label>

                <input type="radio" id="client_booked" name="booked_by" value="Client" required>
                <label for="client_booked">Client</label>

                <input type="radio" id="other_booked" name="booked_by" value="Other" required>
                <label for="other_booked">Other</label>
            </fieldset>
            <button type="submit" class="submitButton">Submit</button>
            <button type="reset" class="resetButton">Reset</button>
        </form>
        <p class="note">An asterisk (*) indicates a required field</p>
    </div>
</body>
</html>
