<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/fieldEntry.css">
</head>
<body>
<div class="navbar">
    <div class="container">
        <div class="navbarBox"><a href="index.html">Home</a></div>
        <div class="navbarBox"><a href="booking.html" class="active">Book Inspection</a></div>
        <div class="navbarBox"><a href="profile.html">Profile</a></div>
    </div>
</div>
<div class = "page">
    <div class = "page-header">
        <h1>Book an Inspection</h1>
        <p>Enter client information</p>
    </div>

    <form action="/submit_booking" method="post" id="booking-form">
        <div class="card">
            <div class="card-title">Inspection Address</div>
            
            <div class = "form-grid">
                <div class = "field">
                    <label for="inspection_address">Street Address *</label>
                    <input type="text" id="inspection_address" name="inspectionAddress" placeholder="69 Lord Seaton Rd" required>
                </div>
                <div class = "field">
                    <label for="Suite">Suite / Unit</label>
                    <input type="text" id="Suite" name="suite" placeholder="420">
                </div>
                <div class = "field">
                    <label for="City">City *</label>
                    <input type="text" id="City" name="city" placeholder="Toronto" required>
                </div>
                <div class = "field">
                    <label for="Zip">Postal / Zip Code</label>
                    <input type="text" id="Zip" name="postalCode" placeholder="M1M 1M1">
                </div>
                <div class = "field">
                    <label for="Province">Province / State</label>
                    <select id="Province" name="province">
                        <option value="" disabled selected>Select province</option>
                        <option value="ON">Ontario</option>
                        <option value="QC">Quebec</option>
                        <option value="NS">Nova Scotia</option>
                        <option value="NB">New Brunswick</option>
                        <option value="MB">Manitoba</option>
                        <option value="BC">British Columbia</option>
                        <option value="PE">Prince Edward Island</option>
                        <option value="SK">Saskatchewan</option>
                        <option value="AB">Alberta</option>
                        <option value="NL">Newfoundland and Labrador</option>
                        <option value="NT">Northwest Territories</option>
                        <option value="YT">Yukon</option>
                        <option value="NU">Nunavut</option>
                    </select>
                </div>
            </div>
        </div>
    
        <!-- Client Info -->
        <div class="card">
            <div class="card-title">Client Info</div>
    
            <div class = "form-grid">
                <div class = "field">
                    <label for="first_name">First Name *</label>
                    <input type="text" id="first_name" name="clientFirstName" placeholder="John" required>
                </div>
                <div class = "field">
                    <label for="last_name">Last Name *</label>
                    <input type="text" id="last_name" name="clientLastName" placeholder="Doe" required>
                </div>
                <div class = "field">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="john@example.com">
                </div>
                <div class = "field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" name="phone" placeholder="416-420-6969">
                </div>
            </div>
        </div>

        <!-- Time -->
        <div class="card">
            <div class="card-title">Date of Inspection</div>
            <div class="form-grid">
                <div class="field">
                    <label for="month">Month</label>
                    <select id="month" name="month">
                        <option value="" disabled selected>Select month</option>
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>
                <div class="field">
                    <label for="day">Day</label>
                    <input type="number" id="day" name="day" placeholder="1" min="1" max="31"/>
                </div>
                <div class="field">
                    <label for="year">Year</label>
                    <input type="number" id="year" name="year" placeholder="2026" min="1900" max="2100"/>
                </div>
            </div>
        </div>

        <!-- Reference -->
        <div class="card">
            <div class = "card-title">Referred By</div>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="referredBy" value="None" checked><span>None</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Buyer Agent"><span>Buyer Agent</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Seller Agent"><span>Seller Agent</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Friend"><span>Friend</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Family"><span>Family</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Lender"><span>Lender</span></label>
                <label class="radio-option"><input type="radio" name="referredBy" value="Other"><span>Other</span></label>
            </div>
        </div>
    
        <!-- Booked By -->
        <div class="card">
            <div class="card-title">Booked By</div>
            <div class="radio-group">
                <label class="radio-option"><input type="radio" name="bookedBy" value="None" checked><span>None</span></label>
                <label class="radio-option"><input type="radio" name="bookedBy" value="Seller Agent"><span>Seller Agent</span></label>
                <label class="radio-option"><input type="radio" name="bookedBy" value="Buyer Agent"><span>Buyer Agent</span></label>
                <label class="radio-option"><input type="radio" name="bookedBy" value="Client"><span>Client</span></label>
                <label class="radio-option"><input type="radio" name="bookedBy" value="Other"><span>Other</span></label>
            </div>
        </div>
    
        <div class="actions">
            <button type="reset" id="resetBtn" class="btn btn-secondary">Reset</button>
            <button type="submit" id="saveBtn" class="btn btn-primary">Save Profile</button>
        </div>

        <p class="note">An asterisk (*) indicates a required field</p>
    </form>
</div>
<script src="../js/booking/booking.js"></script>
</body>
</html>
