<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/bookingView.css">
</head>
<body>
    <div class="container">
        <div class = "navbar">
            <div class = "navbarBox">
                <p><a href="index.html">Home</a></p>
            </div>
            <div class = "navbarBox">
                <p><a href="booking.html">Book inspection</a></p>
            </div>
        </div>
        <div class="details-card">
            <h1>Inspection Booking</h1>

            <div class="detail-row">
                <span class="label">Client:</span>
                <span class="value" id="clientName"></span>
            </div>

            <div class="detail-row">
                <span class="label">Email:</span>
                <span class="value" id="email"></span>
            </div>

            <div class="detail-row">
                <span class="label">Phone:</span>
                <span class="value" id="phone"></span>
            </div>

            <hr>

            <div class="detail-row">
                <span class="label">Address:</span>
                <span class="value" id="address"></span>
            </div>

            <div class="detail-row">
                <span class="label">City:</span>
                <span class="value" id="city"></span>
            </div>

            <div class="detail-row">
                <span class="label">Province:</span>
                <span class="value" id="province"></span>
            </div>

            <div class="detail-row">
                <span class="label">Postal Code:</span>
                <span class="value" id="postalCode"></span>
            </div>

            <hr>

            <div class="detail-row">
                <span class="label">Referred By:</span>
                <span class="value" id="referredBy"></span>
            </div>

            <div class="detail-row">
                <span class="label">Booked By:</span>
                <span class="value" id="bookedBy"></span>
            </div>

            <a href="index.html" class="back-link">← Back to bookings</a>
        </div>
    </div>
    <script src="../js/booking/bookingView.js"></script>
</body>
</html>
