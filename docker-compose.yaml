services:
  backend:
    build: ./home-inspection
    ports:
      - "8080:8080"
    env_file:
      - ./home-inspection/.env
    environment:
      - PDF_SERVICE_URL=http://pdf-service:3001
      - DATASOURCE_URL=jdbc:sqlite:/app/data/database.db
      - UPLOAD_DIR=/app/uploads
      - 'SPRING_APPLICATION_JSON={"spring":{"datasource":{"hikari":{"data-source-properties":{"journal_mode":"DELETE"}}}}}'
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      - pdf-service
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  pdf-service:
    build: ./pdf-service
    ports:
      - "3001:3001"
    environment:
      - SPRING_BASE_URL=http://backend:8080
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"