services:
  backend:
    build: ./home-inspection
    ports:
      - "8080:8080"
    env_file:
      - ./home-inspection/.env
    environment:
      - PDF_SERVICE_URL=http://pdf-service:3001
      - DATASOURCE_URL=jdbc:sqlite:/app/data/database.db
      - UPLOAD_DIR=/app/data/uploads
    volumes:
      - ./database.db:/app/data/database.db
      - ./uploads:/app/data/uploads
    depends_on:
      - pdf-service

  pdf-service:
    build: ./pdf-service
    ports:
      - "3001:3001"
    environment:
      - SPRING_BASE_URL=http://backend:8080