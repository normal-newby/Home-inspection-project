spring.application.name=home-inspection
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DATASOURCE_URL:jdbc:sqlite:D:\\Projects\\Home-inspection-project\\database.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=3

# For synchronous writing to db (for images)
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000
spring.datasource.hikari.data-source-properties.synchronous=NORMAL

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=${JPA_SHOW_SQL:true}

spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=1000MB

pdf.service.url=${PDF_SERVICE_URL:http://localhost:3001}
app.upload-dir=${UPLOAD_DIR:D:\\Projects\\Home-inspection-project\\uploads}

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}

# --- Google Calendar ---
# OAuth client from Google Cloud Console (type: Web application). Leave blank to turn
# the calendar link off; the profile page then shows setup instructions instead.
# The redirect URI must be registered on that client verbatim.
google.oauth.client-id=${GOOGLE_CLIENT_ID:}
google.oauth.client-secret=${GOOGLE_CLIENT_SECRET:}
google.oauth.redirect-uri=${GOOGLE_REDIRECT_URI:http://localhost:8080/api/google/calendar/callback}

# --- Error responses ---
server.error.include-message=always
server.error.include-binding-errors=always

server.error.include-stacktrace=never
server.error.include-exception=false

server.error.whitelabel.enabled=false

# --- Logging ---
logging.level.ca.inspection.home=${LOG_LEVEL_APP:INFO}
# Frameworks: keep the noise down.
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
# Include the correlating request id (when we add one) and short logger names.
# %X{requestId:-} pulls the per-request MDC id set by RequestLoggingFilter.
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{requestId:-}] %logger{36} - %msg%n
logging.file.name=${LOG_FILE:logs/home-inspection.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=14