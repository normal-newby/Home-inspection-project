<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/fieldEntry.css">
    <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyB3r7OGoi5ZOisarq-O0Z_fXlXnxQEWVow&libraries=places"></script>
</head>
<body>
<div class="navbar">
    <div class="container">
        <div class="navbarBox"><a href="index.html">Home</a></div>
        <div class="navbarBox"><a href="booking.html" class="active">Book Inspection</a></div>
        <div class="navbarBox"><a href="profile.html">Profile</a></div>
    </div>
</div>
<div class = "page">
    <div class = "page-header">
        <h1>Book an Inspection</h1>
        <p>Enter client information</p>
    </div>

    <form id="booking-form">
        <div class="card">
            <div class="card-title">Inspection Address</div>
            
            <div class = "form-grid">
                <div class = "field">
                    <label for="inspectionAddress">Street Address *</label>
                    <input type="text" id="inspectionAddress" required>
                </div>
                <div class = "field">
                    <label for="suite">Suite / Unit</label>
                    <input type="text" id="suite">
                </div>
                <div class = "field">
                    <label for="city">City *</label>
                    <input type="text" id="city" required>
                </div>
                <div class = "field">
                    <label for="postalCode">Postal / Zip Code</label>
                    <input type="text" id="postalCode">
                </div>
                <div class = "field">
                    <label for="province">Province / State</label>
                    <select id="province">
                        <option value="" disabled selected>Select province</option>
                        <option value="ON">Ontario</option>
                        <option value="QC">Quebec</option>
                        <option value="NS">Nova Scotia</option>
                        <option value="NB">New Brunswick</option>
                        <option value="MB">Manitoba</option>
                        <option value="BC">British Columbia</option>
                        <option value="PE">Prince Edward Island</option>
                        <option value="SK">Saskatchewan</option>
                        <option value="AB">Alberta</option>
                        <option value="NL">Newfoundland and Labrador</option>
                        <option value="NT">Northwest Territories</option>
                        <option value="YT">Yukon</option>
                        <option value="NU">Nunavut</option>
                    </select>
                </div>
            </div>
        </div>
    
        <!-- Client Info -->
        <div class="card">
            <div class="card-title">Client Info</div>
    
            <div class = "form-grid">
                <div class = "field">
                    <label for="clientFirstName">First Name *</label>
                    <input type="text" id="clientFirstName" required>
                </div>
                <div class = "field">
                    <label for="clientLastName">Last Name *</label>
                    <input type="text" id="clientLastName" required>
                </div>
                <div class = "field">
                    <label for="email">Email</label>
                    <input type="email" id="email">
                </div>
                <div class = "field">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone">
                </div>
            </div>
        </div>

        <!-- Time -->
        <div class="card">
            <div class="card-title">Date of Inspection</div>
            <div class="form-grid">
                <div class="field">
                    <label for="inspectionDate">Pick a Date</label>
                    <input type="date" id="inspectionDate"/>
                </div>
                <div class="field">
                    <label for="month">Month</label>
                    <select id="month">
                        <option value="" disabled selected>Select month</option>
                        <option value="January">January</option>
                        <option value="February">February</option>
                        <option value="March">March</option>
                        <option value="April">April</option>
                        <option value="May">May</option>
                        <option value="June">June</option>
                        <option value="July">July</option>
                        <option value="August">August</option>
                        <option value="September">September</option>
                        <option value="October">October</option>
                        <option value="November">November</option>
                        <option value="December">December</option>
                    </select>
                </div>
                <div class="field">
                    <label for="day">Day</label>
                    <input type="number" id="day" min="1" max="31"/>
                </div>
                <div class="field">
                    <label for="year">Year</label>
                    <input type="number" id="year" min="1900" max="2100"/>
                </div>
                <div class="field">
                    <label for="startTime">Start Time</label>
                    <input type="time" id="startTime"/>
                </div>
                <div class="field">
                    <label for="durationMinutes">Length (minutes)</label>
                    <input type="number" id="durationMinutes" min="15" max="1440" step="15" placeholder="180"/>
                </div>
            </div>
            <p class="field-error" id="dateError"></p>
        </div>

        <!-- Reference -->
        <div class="card">
            <div class = "card-title">Referred By</div>
            <div class="field">
                <select id="referredBy">
                    <option value="None">None</option>
                    <option value="Buyer Agent">Buyer Agent</option>
                    <option value="Seller Agent">Seller Agent</option>
                    <option value="Friend">Friend</option>
                    <option value="Family">Family</option>
                    <option value="Lender">Lender</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>
    
        <!-- Booked By -->
        <div class="card">
            <div class="card-title">Booked By</div>
            <div class="field">
                <select id="bookedBy">
                    <option value="None">None</option>
                    <option value="Seller Agent">Seller Agent</option>
                    <option value="Buyer Agent">Buyer Agent</option>
                    <option value="Client">Client</option>
                    <option value="Other">Other</option>
                </select>
            </div>
        </div>

        <!-- Invoice -->
        <div class="card">
            <div class="card-title">Invoice</div>

            <div class="field">
                <label>Current Invoices</label>
                <div class="invoice-list" id="invoice-list"></div>
                <div class="add-invoice">
                    <select id="select-from-template">
                        <option value="" disabled selected>Add from template</option>
                    </select>
                    <button type="button" class="btn btn-secondary" id="add-invoice-btn">+ Add Invoice</button>
                </div>

                <button type="button" class="btn btn-secondary" id="add-template-btn">+ Create Template</button>

                <div class="card" id="template-form">
                    <div class="form-grid">
                        <div class="field">
                            <label for="type">Type</label>
                            <input type="text" id="type">
                        </div>
                        <div class="field">
                            <label for="fee">Fee ($)</label>
                            <input type="number" id="fee" min="0" step="0.01">
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary" id="save-template-btn">Save Template</button>
                </div>

            </div>
            
            <hr class="divider">
            
            <div class="fee-container">
                <div>
                    <label>Subtotal:</label>
                    <span id="subtotalAmount">$0.00</span>
                </div>
                <div>
                    <label>HST: </label>
                    <span id="hstAmount">$0.00</span>
                </div>
                <div>
                    <label>GST: </label>
                    <span id="gstAmount">$0.00</span>
                </div>
                <div>
                    <label>Total: </label>
                    <span id="totalAmount">$0.00</span>
                </div>
                <div class="checkbox-field checkbox-field-right">
                    <input type="checkbox" id="removeTax">
                    <label for="removeTax">Remove Tax</label>
                </div>
            </div>

            <hr class="divider">

            <div class="checkbox-field">
                <input type="checkbox" id="paidInFull">
                <label for="paidInFull">Paid in Full</label>
            </div>
        </div>

        <div class="actions">
            <button type="reset" id="resetBtn" class="btn btn-secondary">Reset</button>
            <button type="submit" id="saveBtn" class="btn btn-primary">Save Profile</button>
        </div>

        <p class="note">An asterisk (*) indicates a required field</p>
    </form>
</div>
<script type="module" src="../js/booking/booking.js"></script>
<script type="module" src="../js/formFactory.js"></script>
</body>
</html>
