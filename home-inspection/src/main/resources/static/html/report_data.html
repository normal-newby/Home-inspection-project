<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Page</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="stylesheet" href="../css/fieldEntry.css">
</head>
<body>
    <div class="navbar">
        <div class="container">
            <div class="navbarBox"><a href="index.html" class="active">Home</a></div>
            <div class="navbarBox"><a href="booking.html">Book Inspection</a></div>
            <div class="navbarBox"><a href="profile.html">Profile</a></div>
        </div>
    </div>
        
    <div class = "page">
        <div class = "page-header">
            <h1>Report Data</h1>
            <p>Manage your report data</p>
        </div>

        <form id="reportForm">
            <div class="card">
                <div class="card-title">Report Summary</div>
                <div class="form-grid full">
                    <div class="field">
                        <label for="summary">Summary</label>
                        <textarea id="summary" rows="20" placeholder="This is the report summary..."></textarea>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Appendix PDF</div>
                <div class="form-grid full">
                    <div class="field">
                        <span class="appendixPdfLabel">Current: none</span>
                        <input type="file" id="appendixPdf" name="appendixPdf" accept=".pdf" />
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-title">Cover Page Image</div>
                <div class="form-grid full">
                    <div class="field">
                        <span class="coverPageImageLabel">Current: none</span>
                        <input type="file" id="coverPageImage" name="coverPageImage" accept=".jpg,.jpeg,.png" />
                    </div>
                </div>
            </div>
            
            <div class="actions">
                <button type="button" id="resetBtn" class="btn btn-secondary">Reset</button>
                <button type="button" id="saveBtn" class="btn btn-primary">Save</button>
            </div>

            <div class="resultBanner"></div>
            
        </form>
    </div>
</body>

<script type = "module" src = "../js/reportWriting/reportData.js"></script>
<script type = "module" src = "../js/formFactory.js"></script>

</html>
