<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>My Web Page</title>
        <link rel="stylesheet" href="../css/styles.css">
        <link rel="stylesheet" href="../css/inspectionWriting.css">
        <link rel="stylesheet" href="../css/images.css">
        <link rel="stylesheet" href="../css/imageAnnotation.css">
        <link rel="stylesheet" href="../css/recommendations.css">
        <link rel="stylesheet" href="../css/dialog.css">
    </head>
    <body>
        <div class="navbar">
            <div class="container">
                <div class="navbarBox"><a href="index.html" class="active">Home</a></div>
                <div class="navbarBox"><a href="booking.html">Book Inspection</a></div>
                <div class="navbarBox"><a href="profile.html">Profile</a></div>
            </div>
        </div>
        <div class = "body_content">
            <div class="component-nav">
                <p class="nav-label">Components</p>
                <div class="btn-group">
                    <button class="component_button" data-target="roofing">Roofing</button>
                    <button class="component_button" data-target="exterior">Exterior</button>
                    <button class="component_button" data-target="structure">Structure</button>
                    <button class="component_button" data-target="electrical">Electrical</button>
                    <button class="component_button" data-target="heating">Heating</button>
                    <button class="component_button" data-target="cooling">Cooling</button>
                    <button class="component_button" data-target="insulation">Insulation</button>
                    <button class="component_button" data-target="plumbing">Plumbing</button>
                    <button class="component_button" data-target="interior">Interior</button>
                </div>
                <div class="btn-group">
                    <button class="component_button component_button_lower" data-target="description">Description</button>
                    <button class="component_button component_button_lower" data-target="limitations">Limitations</button>
                    <button class="component_button component_button_lower" data-target="recommendations">Recommendations</button>
                </div>
            </div>
            
            <!-- File upload / report actions -->
            <div class="action-bar">
                <label class="file-input-label" for="image-input">＋ Add Images</label>
                <input type="file" id="image-input" accept="image/*" multiple>
                <button id="save-images-button" class="btn btn-secondary" type="button">Save Images</button>
                <button id="edit-report-data" class="btn btn-secondary">Edit Report Data</button>
                <button id="view-report-button" class="btn btn-primary">View Report</button>
                <button id="email-report-button" class="btn btn-primary">Email Report</button>
            </div>

            <div class="upload-progress" hidden>
                <div class="upload-progress-bar-track">
                    <div class="upload-progress-bar"></div>
                </div>
                <span class="upload-progress-label">
                    Uploading...
                    <span class="upload-progress-percentage">0</span>
                    %
                </span>
            </div>

            <div class="images-section">
                <button class="nav-btn prev">←</button>

                <div class="images-viewport">
                    <div class="images-track"></div>
                </div>

                <button class="nav-btn next">→</button>
            </div>

            <p class="image-counts">
                <span class="image-count-total">0 images</span>
                <span class="image-count-separator">·</span>
                <span class="image-count-remaining">0 remaining</span>
            </p>

            <div class="show-image-box" hidden>
                <button class="close-button">X</button>
                <div class="image-container"></div>
                <button class="delete-image-button">delete image</button>
            </div>
            
            <!-- Fields! -->
            <p class="helper-text">Click an item to add. Highlighted items are already added — right-click to delete, double-click to edit.</p>

            <input type="text" class="field-search" placeholder="search fields"></input>
            <div class="fields"></div>

            <!-- Select image / annotation box -->
            <div class="select-image-box" hidden>
                <p class="existing-image-text">Selected Image</p>
                <div class="existing-image-div" hidden>
                    <div class="image-canvas-wrapper">
                        <img class="existing-image-image" alt="">
                    </div>
                    <div class="annotation-tools" hidden>
                        <!-- Base shapes -->
                        <button id="rect-tool">Rectangle</button>
                        <button id="circle-tool">Circle</button>
                        <button id="ellipse-tool">Ellipse</button>
                        <button id="arrow-tool">Arrow</button>

                        <!-- Text -->
                        <label for="text-tool">Text:</label>
                        <input type="text" id="text-tool" placeholder="Enter text…">
                        <button id="add-text">Add Text</button>

                        <!-- Commands -->
                        <button id="edit-mode">Edit Mode</button>
                        <button id="delete-mode">Delete Mode</button>
                        <button id="save-annotations">Save</button>

                        <!-- Other -->
                        <input type="color" id="color-picker" value="#ff0000">
                        <label for="stroke-size" class="stroke-label">Size: <span id="stroke-size-value">3</span></label>
                        <input type="range" id="stroke-size" min="1" max="10" value="3">

                        <!-- Arrows only: snap the direction to 45° steps -->
                        <span class="clip-angle-field">
                            <input type="checkbox" id="clip-arrow-angle">
                            <label for="clip-arrow-angle" class="stroke-label">Clip 45°</label>
                        </span>

                        <!-- Arrows only: lock the length to the head, so the drag only aims it -->
                        <span class="clip-angle-field">
                            <input type="checkbox" id="fix-arrow-length">
                            <label for="fix-arrow-length" class="stroke-label">Fix length</label>
                        </span>

                        <span id="edit-hint" hidden></span>
                        <span id="success-message"></span>
                    </div>
                </div>
            
                <!-- Blank items only: the inspector names the condition themselves -->
                <div class="condition-name-section" hidden>
                    <div class="condition-name-header">
                        <label for="condition-name">Condition Name</label>
                        <div class="permanent-value-row">
                            <input type="checkbox" id="save-permanent-value">
                            <label for="save-permanent-value">Save as permanent value</label>
                        </div>
                    </div>
                    <textarea id="condition-name" rows="2"
                              placeholder="Name this condition, e.g. Cracked parging at front wall"></textarea>
                    <div class="condition-name-actions">
                        <button id="save-condition-name">Save Condition Name</button>
                        <span class="condition-name-message"></span>
                    </div>
                </div>

                <div class="images-section">
                    <button class="nav-btn prev">←</button>
                    <div class="images-viewport">
                        <div class="images-track"></div>
                    </div>
                    <button class="nav-btn next">→</button>
                </div>
            
                <div class="add-note-section">
                    <label for="note-text">Annotation Note</label>
                    <textarea id="note-text" rows="4"></textarea>
                    <button id="save-note">Save Note</button>
                </div>

                <div class="include-summary-row" hidden>
                    <input id="include-in-summary" type="checkbox">
                    <label for="include-in-summary">Include in summary</label>
                </div>
            
                <button id="show-recommendation-button" hidden>Recommendations</button>
            </div>

            <!-- Recommendations panel -->
            <div class="recommendations-panel" hidden>
                <h3>Recommendations</h3>
                <div class="recommendations-section-wrapper"></div>
                <div class="recommendations-footer">
                    <div class = "default-implication-checkbox">
                        <input type="checkbox" id="default-implication-checkbox">
                        <label for="default-implication-checkbox">Save as default implication</label>
                    </div>
                    <span class="recommendations-display-message"></span>
                    <button id="submit-recommendations-button">Save and Submit</button>
                </div>
            </div>
            
        </div>

        <script type="module" src="../js/fetchExisting.js"></script>
        <script type = "module" src = "../js/reportWriting/loadFields.js"></script>
        <script type = "module" src = "../js/reportWriting/getReport.js"></script>
        <script type = "module" src = "../js/reportWriting/loadImages.js"></script>
        <script type = "module" src = "../js/reportWriting/imageAnnotation.js"></script>
        <script type = "module" src = "../js/reportWriting/recommendations.js"></script>
        <script type = "module" src = "../js/reportWriting/reportTopBar.js"></script>
    </body>
</html>
