<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <title>Inspection Report Preview</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 24px;
            line-height: 1.4;
            color: #222;
        }

        h1 {
            margin-bottom: 0.2em;
        }

        h2 {
            margin-top: 1.5em;
            margin-bottom: 0.4em;
            border-bottom: 1px solid #ddd;
            padding-bottom: 0.1em;
        }

        .section {
            margin-bottom: 1.2em;
        }

        .field {
            padding: 0.4em 0;
            border-bottom: 1px solid #eee;
        }

        .field:last-child {
            border-bottom: none;
        }

        .label {
            font-weight: 700;
        }

        .field-value {
            margin-left: 0.4em;
        }

        .btn {
            display: inline-block;
            padding: 0.5em 1em;
            border-radius: 4px;
            border: 1px solid #333;
            background-color: #0b62a4;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            margin-top: 1em;
        }

        .btn:hover {
            background-color: #084b7a;
        }

        img.report-image {
            max-width: 100%;
            height: auto;
            margin: 0.5em 0;
            border: 1px solid #ddd;
            padding: 4px;
            border-radius: 4px;
        }

        .meta {
            margin-bottom: 1em;
        }

        .meta span {
            display: inline-block;
            margin-right: 1.5em;
        }
    </style>
</head>
<body>
    <h1>Inspection Report Preview</h1>

    <div class="meta">
        <span><strong>Booking ID:</strong> <span th:text="${report.inspectionBooking.id}"></span></span>
        <span><strong>Report ID:</strong> <span th:text="${report.id}"></span></span>
    </div>

    <div class="section">
        <h2>Summary</h2>
        <p th:if="${report.fields == null || #lists.isEmpty(report.fields)}">No fields have been filled in yet.</p>
        <div th:if="${report.fields != null}">
            <div th:each="field : ${report.fields}" class="field">
                <div><span class="label" th:text="${field.inspectionFieldDefinition.fieldName}"></span></div>
                <div class="field-value" th:if="${field.selectedValue != null}" th:text="${field.selectedValue.value}"></div>
                <div class="field-value" th:if="${field.note != null}" th:text="${field.note}"></div>
            </div>
        </div>
    </div>

    <div class="section">
        <h2>Images</h2>
        <div th:if="${report.images == null || #lists.isEmpty(report.images)}">
            <p>No images have been added yet.</p>
        </div>
        <div th:each="image : ${report.images}">
            <div>
                <div class="label" th:text="${image.description}"></div>
                <img class="report-image" th:src="${image.imageUrl}" alt="Inspection image" />
            </div>
        </div>
    </div>

    <a th:href="@{/report/{id}/pdf(id=${report.inspectionBooking.id})}" class="btn" target="_blank">Download PDF</a>
</body>
</html>
