# Integration-test profile. Uses a fresh file-backed SQLite DB in target/
spring.datasource.url=jdbc:sqlite:target/integration-test.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# Silence SQL echo and drop app logs to WARN so failure output stays readable.
spring.jpa.show-sql=false
logging.level.ca.inspection.home=WARN

# SQLite writes serialize on a single writer, so keep the pool tiny for tests
# to avoid busy-timeouts under parallel-ish flows.
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.data-source-properties.journal_mode=WAL
spring.datasource.hikari.data-source-properties.busy_timeout=5000

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.show-sql=false

# Uploads land under target/ so mvn clean wipes them.
app.upload-dir=target/integration-test-uploads

# Never call a real PDF service from tests. Point at a dead port so any
# accidental call fails fast; anything that needs it should mock RestTemplate.
pdf.service.url=http://localhost:0

gemini.api-key=
gemini.model=gemini-3.6-flash
